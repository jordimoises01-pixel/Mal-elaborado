<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Utileria JS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container">
        <h1>Acceso a la Cuenta</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com">
                <span class="mensaje-error" id="errCorreo">Ingrese un correo válido.</span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="••••••••">
                <span class="mensaje-error" id="errPassword">Debe contener 8+ caracteres, mayúscula, minúscula, número y carácter especial.</span>
            </div>

            <button type="submit" class="btn">Ingresar</button>
        </form>

        <a href="index.html" class="nav-link">Volver al Formulario Principal</a>
    </div>

    <script src="js/utileria.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            const correoValido = validarCorreo(correo);
            const passValida = validarPassword(password);

            document.getElementById('errCorreo').style.display = correoValido ? 'none' : 'block';
            document.getElementById('errPassword').style.display = passValida ? 'none' : 'block';

            if (correoValido && passValida) {
                alert('¡Inicio de sesión exitoso!');
            }
        });
    </script>
</body>
</html>
